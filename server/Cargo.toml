[package]
name = "saju-server"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.9.0", features = ["d1"] }

[profile.release]
opt-level = "s"
lto = true
