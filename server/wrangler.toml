name = "yeokma-saju"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"

[build]
command = "worker-build --release"

[vars]
# 모델은 이 값 하나로 바꾼다
MODEL = "deepseek/deepseek-v4.1-flash-1017"

[[d1_databases]]
binding = "DB"
database_name = "yeokma-saju"
database_id = "00000000-0000-0000-0000-000000000000" # 로컬 실행 전용이라 이 값은 쓰지 않는다
migrations_dir = "migrations"
